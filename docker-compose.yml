services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wrany-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - wrany-net
    # NATS is the internal event bus — never exposed to external clients.
    # 4222 is bound to 127.0.0.1 for local dev only (integration tests, nats CLI).
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - 'http://localhost:8222/healthz?js-enabled-only=true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  tracking-gateway:
    restart: always
    build:
      context: .
      dockerfile: services/tracking-gateway/Dockerfile
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://wrany:wrany@postgres:5432/wrany?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-24h}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-WRANY_EVENTS}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-tempo:4317}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - wrany-net
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  tracking-worker:
    restart: always
    build:
      context: .
      dockerfile: services/tracking-worker/Dockerfile
    environment:
      WORKER_PORT: ${WORKER_PORT:-8081}
      DATABASE_URL: ${DATABASE_URL:-postgres://wrany:wrany@postgres:5432/wrany?sslmode=disable}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-WRANY_EVENTS}
      NATS_LOCATION_SUBJECT: ${NATS_LOCATION_SUBJECT:-location.events.v1}
      NATS_LOCATION_CONSUMER_DURABLE: ${NATS_LOCATION_CONSUMER_DURABLE:-tracking-worker-location-consumer}
      NATS_CONSUMER_ACK_WAIT_SEC: ${NATS_CONSUMER_ACK_WAIT_SEC:-30}
      NATS_CONSUMER_MAX_DELIVER: ${NATS_CONSUMER_MAX_DELIVER:-5}
      NATS_CONSUMER_BATCH_SIZE: ${NATS_CONSUMER_BATCH_SIZE:-100}
      NATS_CONSUMER_POLL_TIMEOUT_SEC: ${NATS_CONSUMER_POLL_TIMEOUT_SEC:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-tempo:4317}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    ports:
      - "${WORKER_PORT:-8081}:8081"
    networks:
      - wrany-net
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - wrany-net
    depends_on:
      - tracking-gateway
    profiles:
      - web

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8088:8080"
    environment:
      SWAGGER_JSON_URL: http://localhost:8080/swagger/doc.json
    profiles:
      - tools

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - wrany-net
    profiles:
      - observability

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - wrany-net
    depends_on:
      - prometheus
    profiles:
      - observability

  loki:
    image: grafana/loki:3.0.0
    user: "0"
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/var/loki
    ports:
      - "3100:3100"
    networks:
      - wrany-net
    profiles:
      - observability

  promtail:
    image: grafana/promtail:3.0.0
    user: "0"
    volumes:
      - ./infra/observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wrany-net
    depends_on:
      - loki
    profiles:
      - observability

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://wrany:wrany@postgres:5432/wrany?sslmode=disable}
    ports:
      - "9187:9187"
    networks:
      - wrany-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - observability

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    command: ["-varz", "-jsz=all", "http://nats:8222"]
    ports:
      - "7777:7777"
    networks:
      - wrany-net
    depends_on:
      nats:
        condition: service_healthy
    profiles:
      - observability

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
    networks:
      - wrany-net
    profiles:
      - observability

volumes:
  postgres_data:
  nats_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  wrany-net:
    driver: bridge
