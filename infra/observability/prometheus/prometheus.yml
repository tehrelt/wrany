global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tracking-gateway
    static_configs:
      - targets: ["tracking-gateway:8080"]

  - job_name: tracking-worker
    static_configs:
      - targets: ["tracking-worker:8081"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: nats-exporter
    static_configs:
      - targets: ["nats-exporter:7777"]
