services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wrany-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - wrany-net
    # NATS is the internal event bus — never exposed to external clients.
    # 4222 is bound to 127.0.0.1 for local dev only (integration tests, nats CLI).
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://localhost:8222/healthz?js-enabled-only=true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracking-gateway:
    restart: always
    build:
      context: .
      dockerfile: services/tracking-gateway/Dockerfile
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://wrany:wrany@postgres:5432/wrany?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-24h}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-WRANY_EVENTS}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - wrany-net
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  tracking-worker:
    restart: always
    build:
      context: .
      dockerfile: services/tracking-worker/Dockerfile
    environment:
      WORKER_PORT: ${WORKER_PORT:-8081}
      DATABASE_URL: ${DATABASE_URL:-postgres://wrany:wrany@postgres:5432/wrany?sslmode=disable}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-WRANY_EVENTS}
      NATS_LOCATION_SUBJECT: ${NATS_LOCATION_SUBJECT:-location.events.v1}
      NATS_LOCATION_CONSUMER_DURABLE: ${NATS_LOCATION_CONSUMER_DURABLE:-tracking-worker-location-consumer}
      NATS_CONSUMER_ACK_WAIT_SEC: ${NATS_CONSUMER_ACK_WAIT_SEC:-30}
      NATS_CONSUMER_MAX_DELIVER: ${NATS_CONSUMER_MAX_DELIVER:-5}
      NATS_CONSUMER_BATCH_SIZE: ${NATS_CONSUMER_BATCH_SIZE:-100}
      NATS_CONSUMER_POLL_TIMEOUT_SEC: ${NATS_CONSUMER_POLL_TIMEOUT_SEC:-5}
    ports:
      - "${WORKER_PORT:-8081}:8081"
    networks:
      - wrany-net
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - wrany-net
    depends_on:
      - tracking-gateway
    profiles:
      - web

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8088:8080"
    environment:
      SWAGGER_JSON_URL: http://localhost:8080/swagger/doc.json
    profiles:
      - tools

volumes:
  postgres_data:
  nats_data:

networks:
  wrany-net:
    driver: bridge
