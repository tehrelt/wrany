services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wrany-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - wrany-net
    # NATS is the internal event bus — never exposed to external clients.
    # 4222 is bound to 127.0.0.1 for local dev only (integration tests, nats CLI).
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://localhost:8222/healthz?js-enabled-only=true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracking-gateway:
    build:
      context: ./services/tracking-gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - wrany-net
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  tracking-worker:
    build:
      context: ./services/tracking-worker
      dockerfile: Dockerfile
    environment:
      WORKER_PORT: ${WORKER_PORT:-8081}
    ports:
      - "${WORKER_PORT:-8081}:8081"
    networks:
      - wrany-net
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  nats_data:

networks:
  wrany-net:
    driver: bridge
